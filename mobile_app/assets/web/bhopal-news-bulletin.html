<script>
// 1) Har text ka font-size apne-aap adjust hota hai taaki width reference image se match kare
function fitText(){
  document.querySelectorAll('.t').forEach(function(e){
    var fs=parseFloat(e.dataset.fs)||40, target=parseFloat(e.dataset.w);
    for(var i=0;i<4;i++){ e.style.fontSize=fs+'px'; var w=e.offsetWidth; if(!w)break; fs=fs*target/w; }
    e.style.fontSize=fs+'px';
  });
}
// 2) Poster ko screen me fit karta hai
function fitScreen(){
  var w=document.getElementById('wrap');
  if(!w) return;
  var vw = window.innerWidth || document.documentElement.clientWidth || 360;
  var vh = window.innerHeight || document.documentElement.clientHeight || 640;
  var s = Math.min(vw/941, vh/1672);
  var leftOffset = Math.max(0, (vw - 941 * s) / 2);
  var topOffset = Math.max(0, (vh - 1672 * s) / 2);
  w.style.transform='scale('+s+')';
  w.style.transformOrigin='top left';
  w.style.position='absolute';
  w.style.left=leftOffset+'px';
  w.style.top=topOffset+'px';
  w.style.width='941px';
  w.style.height='1672px';
}
setInterval(fitScreen, 500);
function init(){ fitText(); fitScreen(); }
function setVisible(id, visible){
  var el=document.getElementById(id);
  if(el){
    if(visible){
      el.style.removeProperty('display');
    }else{
      el.style.setProperty('display', 'none', 'important');
    }
  }
}
function splitHeadline(text){
  if(!text) return ['',''];
  if(text.indexOf(',')!==-1){
    var p=text.split(',');
    return [p[0].trim()+',', p.slice(1).join(',').trim()];
  }
  if(text.indexOf(':')!==-1){
    var p=text.split(':');
    return [p[0].trim()+':', p.slice(1).join(':').trim()];
  }
  var words=text.trim().split(/\s+/);
  if(words.length>4){
    var mid=Math.ceil(words.length/2);
    return [words.slice(0,mid).join(' '), words.slice(mid).join(' ')];
  }
  return [text,''];
}
function setPreviewData(data){
  if(!data) return;
  var parts=splitHeadline(data.headline||'भोपाल में आज तेज बारिश, कई इलाकों में जलभराव');
  var h1=document.getElementById('headline1'), h2=document.getElementById('headline2');
  if(h1) h1.textContent=parts[0]||'';
  if(h2) h2.textContent=parts[1]||'';
  var sub=document.getElementById('subtitle');
  var subBox=document.querySelector('.sub');
  var hasSub = data.subtitle && data.subtitle.trim();
  if(sub) {
    sub.textContent = hasSub ? data.subtitle.trim() : '';
    sub.style.display = hasSub ? '' : 'none';
  }
  if(subBox) {
    subBox.style.display = hasSub ? '' : 'none';
  }
  var loc=document.getElementById('locationText');
  if(loc) loc.textContent=(data.location||'भोपाल, मध्य प्रदेश').replace(/^📍\s*/,'');
  var label=document.getElementById('label');
  if(label) label.textContent=data.tickerTag||'ताजा खबर';
  var t1=document.getElementById('track1'), t2=document.getElementById('track2');
  if(t1) t1.textContent='';
  if(t2) t2.textContent='';
  var tickerText=document.getElementById('tickerText');
  var tVal=(data.ticker||data.tickerText||'').trim()||'भोपाल | इंदौर | ग्वालियर | जबलपुर | उज्जैन | सागर | रीवा | और देश-दुनिया की हर खबर';
  if(tickerText){
    tickerText.innerHTML='<div class="ticker-roller" id="tickerRoller"><div class="roll-part" style="padding-bottom:28px;">'+tVal+'</div><div class="roll-part" style="padding-bottom:28px;">'+tVal+'</div></div>';
    var roller=document.getElementById('tickerRoller');
    var firstPart=roller?roller.firstElementChild:null;
    if(firstPart){
      var h=firstPart.offsetHeight;
      if(h<=72){
        roller.style.animation='none';
        roller.innerHTML='<div style="height:72px;display:flex;align-items:center;">'+tVal+'</div>';
      }else{
        var duration=Math.max(8,Math.round(h/18));
        roller.style.animationDuration=duration+'s';
      }
    }
  }
  document.querySelector('.poster').classList.toggle('ticker-off', !data.tickerEnabled);
  document.querySelector('.poster').classList.toggle('datetime-off', !data.datetimeEnabled);
  setVisible('loc', !!data.locationEnabled);
  setVisible('locationText', !!data.locationEnabled);
  setVisible('time', !!data.datetimeEnabled && !!data.tickerEnabled);
  setVisible('date', !!data.datetimeEnabled && !!data.tickerEnabled);
  setVisible('weekday', !!data.datetimeEnabled && !!data.tickerEnabled);
  setVisible('label', !!data.tickerEnabled);
  setVisible('ticker', !!data.tickerEnabled);
  var video=document.getElementById('mainVideo');
  if(data.videoSrc){
    if(!video){
      video=document.createElement('video');
      video.id='mainVideo';
      video.autoplay=true; video.loop=true; video.muted=true; video.playsInline=true;
      video.style.cssText='width:100%;height:100%;object-fit:contain;display:block';
      document.getElementById('mainImage').appendChild(video);
    }
    if(video.src!==data.videoSrc){ video.src=data.videoSrc; video.load(); }
    video.muted=true;
    video.playsInline=true;
    video.play().catch(function(){});
  } else if(video) {
    video.removeAttribute('src'); video.load();
  }
  if(data.frameScale){
    var scaleVal = data.frameScale;
    var f = document.querySelector('.frame');
    if(f){
      var w, h, x, y;
      var stdW = 898;
      var topBound = 340;
      var bottomBound = data.tickerEnabled ? 1150 : 1320;
      var availH = bottomBound - topBound;
      var centerY = Math.round((topBound + bottomBound) / 2);
      var stdH = Math.min(717, Math.round(availH * 0.88));
      if (scaleVal >= 100) {
        var t = Math.min(1.0, (scaleVal - 100) / 150);
        w = Math.round(stdW + (941 - stdW) * t);
        h = Math.round(stdH + (availH - stdH) * t);
      } else {
        var scale = Math.max(0.5, scaleVal / 100);
        w = Math.round(stdW * scale);
        h = Math.round(stdH * scale);
      }
      x = Math.round((941 - w) / 2);
      y = Math.round(centerY - (h / 2));
      f.style.width = w + 'px';
      f.style.height = h + 'px';
      f.style.left = x + 'px';
      f.style.top = y + 'px';
      f.style.zIndex = '1';
      if(video){
        video.style.objectFit = (scaleVal >= 180) ? 'cover' : 'contain';
      }
      var loc = document.getElementById('loc');
      if(loc){
        loc.style.left = Math.max(22, x + 10) + 'px';
        loc.style.top = Math.max(355, y + 17) + 'px';
      }
      var locText = document.getElementById('locationText');
      if(locText){
        locText.style.left = Math.max(98, x + 86) + 'px';
        locText.style.top = Math.max(386, y + 48) + 'px';
      }
    }
  }
  if(data.logoSrc){
    var pLogo = document.getElementById('portraitLogoImg');
    if(pLogo) pLogo.src = data.logoSrc;
  }
  fitText();
  fitScreen();
}
window.addEventListener('message',function(event){
  if(event.origin===window.location.origin && event.data){
    if(event.data.type==='portrait-preview'){
      setPreviewData(event.data);
    } else if(event.data.type==='portrait-audio-control'){
      var v=document.getElementById('mainVideo');
      if(v){
        if(event.data.muted!==undefined) v.muted=event.data.muted;
        if(event.data.volume!==undefined) v.volume=event.data.volume;
        if(event.data.currentTime!==undefined) v.currentTime=event.data.currentTime;
        if(event.data.action==='play') v.play().catch(function(){});
        if(event.data.action==='pause') v.pause();
      }
    }
  }
});
window.addEventListener('resize',fitScreen);
window.addEventListener('load',init);
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(init);}
init();
</script>
</body>
</html>
