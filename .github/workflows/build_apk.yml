name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Scaffold Clean Official Flutter Project
        run: |
          # 1. Create pristine official app scaffold with Flutter 3.24.5
          flutter create -t app --org com.shreenews --project-name studio clean_app
          
          # 2. Transfer our code, assets, custom manifest and launcher icons
          rm -rf clean_app/lib/*
          cp -r mobile_app/lib/* clean_app/lib/
          cp -r mobile_app/assets clean_app/
          cp mobile_app/pubspec.yaml clean_app/pubspec.yaml

          # Copy custom AndroidManifest.xml (contains android:label="Shree News")
          cp mobile_app/android/app/src/main/AndroidManifest.xml clean_app/android/app/src/main/AndroidManifest.xml

          # Copy custom MainActivity.kt with native MediaScanner connection
          rm -rf clean_app/android/app/src/main/kotlin/*
          mkdir -p clean_app/android/app/src/main/kotlin
          cp -r mobile_app/android/app/src/main/kotlin/* clean_app/android/app/src/main/kotlin/

          # Remove default flutter adaptive icons so Android strictly uses our custom ic_launcher PNGs
          rm -rf clean_app/android/app/src/main/res/mipmap-anydpi-v26

          # Copy custom launcher icons (golden sword "श्री" icon in all mipmap densities)
          cp -r mobile_app/android/app/src/main/res/* clean_app/android/app/src/main/res/

          # 3. Transfer our production Gradle configs, signing keystore, and mirrors
          rm -f clean_app/android/build.gradle.kts clean_app/android/app/build.gradle.kts
          cp mobile_app/android/build.gradle clean_app/android/build.gradle
          cp mobile_app/android/app/build.gradle clean_app/android/app/build.gradle
          cp mobile_app/android/app/release.jks clean_app/android/app/release.jks

          # 4. Configure Android SDK 34 (Android 14 standard) & MinSDK 24 in local.properties
          echo "flutter.minSdkVersion=24" >> clean_app/android/local.properties
          echo "flutter.compileSdkVersion=34" >> clean_app/android/local.properties
          echo "flutter.targetSdkVersion=34" >> clean_app/android/local.properties

      - name: Build Android Release APK
        run: |
          cd clean_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShreeNewsStudio-Release-APK
          path: clean_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Shree News Studio Release"
          body: "Latest signed production APK. Tap app-release.apk below to download directly without extracting."
          files: clean_app/build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
