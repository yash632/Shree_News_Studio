name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold native Android wrapper
        run: |
          cd mobile_app
          cp android/app/build.gradle /tmp/app_build.gradle.bak || true
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak || true
          flutter create --org com.shreenews --platforms=android .
          cp /tmp/app_build.gradle.bak android/app/build.gradle
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          chmod +x android/gradlew

      - name: Get Flutter Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile_app
          flutter build apk --release -v

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShreeNewsStudio-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
