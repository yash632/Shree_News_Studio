name: shree_news_studio
description: "Shree News Studio - Professional Hindi TV Broadcast News Creation Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # In-App Live HTML5 Broadcast Template Monitor
  webview_flutter: ^4.10.0

  # Hardware-Accelerated Local Mobile FFmpeg Engine
  ffmpeg_kit_flutter_full_gpl: ^6.0.3

  # Media File Selection (Phone Storage & Gallery)
  file_picker: ^8.1.4

  # Direct HTTP & Cloud AI Calling (Groq / Mistral)
  http: ^1.2.2

  # File Storage Path Resolution
  path_provider: ^2.1.4

  # Android Runtime Storage & Media Permissions
  permission_handler: ^11.3.1

  # Open Exported Broadcast Video in System Player
  open_file: ^3.5.10

  # High-Performance Video Player for Live Monitor & Output Preview
  video_player: ^2.9.2

  # UI Enhancement Icons
  cupertino_icons: ^1.0.8

  # Cryptographic Hashing for Microsoft DRM Sec-MS-GEC Token
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/master_broadcast_plate.png
    - assets/master_broadcast_plate_portrait.png
    - assets/master_broadcast_plate_no_ticker.png
    - assets/master_broadcast_plate_portrait_no_ticker.png
    - assets/web/
    - assets/web/fonts/
    - assets/web/static/

  fonts:
    - family: Hind
      fonts:
        - asset: assets/web/fonts/Hind-Regular.ttf
        - asset: assets/web/fonts/Hind-SemiBold.ttf
          weight: 600
        - asset: assets/web/fonts/Hind-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/web/fonts/NotoSansDevanagari.ttf
