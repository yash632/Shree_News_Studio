<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHRI NEWS 24×7 – Broadcast Template</title>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Hind';
  src: url('fonts/Hind-Bold.ttf') format('truetype'), url('../fonts/Hind-Bold.ttf') format('truetype');
  font-weight: 700 900;
}
@font-face {
  font-family: 'Hind';
  src: url('fonts/Hind-Regular.ttf') format('truetype'), url('../fonts/Hind-Regular.ttf') format('truetype');
  font-weight: 400 600;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#canvas{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
 font-family:'Hind','Noto Sans Devanagari',sans-serif;font-weight:700;color:#111;
 background:radial-gradient(ellipse at 50% 45%,#1b2a6b 0%,#0c1440 45%,#2a0a14 100%)}
.abs{position:absolute}

/* backdrop red glow */
.glow{position:absolute;inset:0;background:
 linear-gradient(115deg,transparent 30%,rgba(200,10,25,.55) 45%,transparent 60%),
 radial-gradient(ellipse at 0 50%,#b30d1c 0,transparent 40%),
 radial-gradient(ellipse at 100% 20%,#b30d1c 0,transparent 35%);z-index:2}

/* HEADER NAVBAR */
#header{left:0;top:0;width:1920px;height:148px;background:linear-gradient(#ffffff,#f4f4f4);border-bottom:5px solid #c4121f;box-shadow:0 4px 14px rgba(0,0,0,.45);z-index:10}

/* BANNER */
#banner{left:28px;top:22px;width:580px;height:104px;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,#fff27a 0,#ffd21f 40%,#ffb000 100%);box-shadow:0 3px 8px rgba(0,0,0,.45);z-index:20}
#banner:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 45%);pointer-events:none}
#banner .red{position:absolute;left:0;top:0;width:290px;height:104px;background:linear-gradient(165deg,#f2131f 0,#c30d18 55%,#960812 100%);clip-path:polygon(0 0,260px 0,275px 52px,257px 104px,0 104px)}
.fit{position:absolute;white-space:nowrap;line-height:1;transform:translate(-50%,-50%);width:max-content;font-family:'Hind','Noto Sans Devanagari',sans-serif}
.bt1{color:#fff;font-weight:800;-webkit-text-stroke:2px #fff;text-shadow:0 3px 3px rgba(0,0,0,.45);z-index:2}
.bt2{color:#120606;font-weight:800;-webkit-text-stroke:2px #120606;z-index:2}

/* HEADER CARDS */
.card{top:24px;height:100px;background:linear-gradient(#ffffff,#f0f0f0);border-left:4px solid #c4121f;box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;flex-direction:column;justify-content:center;z-index:20}
.card.card-1{left:618px;width:334px;padding-left:140px}
.card.card-2{left:958px;width:294px;padding-left:116px}
.card.card-3{left:1258px;width:350px;padding-left:140px}

.card .a{font-size:25px;line-height:32px;color:#1c1c1c;font-weight:600;letter-spacing:-0.2px}
.card .b{font-size:28px;line-height:34px;color:#c4121f;font-weight:800;letter-spacing:-0.2px}

.thumb-box{position:absolute;left:10px;top:5px;width:120px;height:88px;border-radius:4px;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.4);overflow:hidden;background:#222;display:flex;align-items:center;justify-content:center}
.thumb-box img{width:100%;height:100%;object-fit:cover;display:block}

/* Globe circular thumbnail */
.thumb-box.globe-box{left:12px;top:5px;width:88px;height:88px;border-radius:50%;border:2px solid #ffffff;box-shadow:0 2px 6px rgba(0,0,0,.45)}

/* LOGO BADGE */
#logo {
  left: 1625px;
  top: 0px;
  width: 295px;
  height: 172px;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
#logo img, #logo #logoImg {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* LEFT PANEL */
#left{left:28px;top:162px;width:375px;height:595px;border-radius:24px;border:4px solid #f5b81c;
 background:linear-gradient(180deg,#e01a25,#a50b17 60%,#8a0813);box-shadow:0 0 18px rgba(255,190,40,.8),inset 0 0 20px rgba(0,0,0,.35);z-index:20}
#left h2{position:absolute;left:38px;top:4px;font-size:60px;line-height:80px;font-weight:900;color:#fff;text-shadow:0 3px 4px rgba(0,0,0,.5)}
#left h2 span{color:#ffc61a}
.news{position:absolute;left:10px;width:348px;height:88px;border-radius:15px;background:linear-gradient(#ffffff,#ececec);box-shadow:0 2px 4px rgba(0,0,0,.4);display:flex;align-items:center}
.num{width:72px;height:72px;margin-left:8px;border-radius:11px;background:linear-gradient(#d9232d,#8d0813);color:#fff;font:800 42px/72px 'Hind',sans-serif;text-align:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 2px 3px rgba(0,0,0,.4)}
.news .tx{margin-left:14px;font-size:27px;line-height:33px;color:#1a1a1a;font-weight:700;width:235px}

/* LOCATION TAG */
#loc{left:1130px;top:192px;height:54px;display:flex;box-shadow:0 3px 8px rgba(0,0,0,.5);z-index:20;border-radius:4px;overflow:hidden}
#loc .pin{width:54px;height:54px;background:linear-gradient(#e11d2a,#a00a16);position:relative}
#loc .pin:after{content:"";position:absolute;left:17px;top:10px;width:20px;height:20px;border-radius:50% 50% 50% 0;background:#fff;transform:rotate(-45deg);top:11px}
#loc .pin:before{content:"";position:absolute;left:23px;top:17px;width:8px;height:8px;border-radius:50%;background:#c4121f;z-index:2}
#loc .nm{background:#0d1f5c;color:#fff;font-size:28px;line-height:54px;padding:0 22px 0 12px;font-weight:700}

/* MAIN AREA FRAME (footage frame) */
#frame{left:575px;top:173px;width:770px;height:567px;border:none;box-shadow:none;background:transparent;z-index:4}

/* BREAKING NEWS BAND */
#brk{left:0;top:765px;width:1920px;height:183px;overflow:hidden;box-shadow:0 -3px 8px rgba(0,0,0,.5);
 background:radial-gradient(ellipse 320px 90px at 1600px 25px,rgba(235,10,5,.55),transparent),
 linear-gradient(180deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 45%,rgba(0,0,0,.22) 100%),
 linear-gradient(90deg,#e30101 0,#e30101 26%,#c80300 34%,#a50100 42%,#960101 52%,#900100 70%,#8c0100 100%);z-index:20}
#brk:before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:linear-gradient(90deg,#f9b61e 0,#f9b61e 35%,rgba(249,182,30,0) 60%);z-index:9}

#sub{position:absolute;left:480px;top:110px;width:1440px;height:70px;background:linear-gradient(90deg,#b3b1b1 0,#b3b1b1 4%,#d6d4d4 8%,#e9e8e8 11%,#f0f0ef 36%,#efeeed 64%,#e2e3e3 85%,#d5d5d5 100%);clip-path:polygon(54px 0,100% 0,100% 100%,12px 100%)}
#brk .hs{color:#fff;font-weight:800;text-shadow:0 4px 6px rgba(0,0,0,.6);-webkit-text-stroke:1.5px #fff}
#sub .st{color:#141414;font-weight:800;-webkit-text-stroke:0.5px #141414}
#hl{position:absolute;left:545px;width:1335px;top:10px;height:90px;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;overflow:hidden;z-index:22;transform:none !important}
#subt{position:absolute;left:65px;width:1315px;top:0;height:70px;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;overflow:hidden;z-index:22;transform:none !important}

#band{position:absolute;inset:0;background:linear-gradient(180deg,#b0906f 0,#b4906f 8%,#7c3304 36%,#5e0e04 60%,#4c0303 85%,#490101 100%);clip-path:polygon(0 40px,22px 3px,108px 180px,62px 180px)}
#lc{position:absolute;inset:0;background:#d7d6d6;clip-path:polygon(0 40px,62px 180px,0 180px)}
#hexo,#hexi,#gold{position:absolute;left:0;top:0;width:560px;height:183px}
#hexo{background:linear-gradient(180deg,#ffc933 0,#f9b020 60%,#d9700e 100%);clip-path:polygon(22px 3px,425px 3px,472px 97px,428px 180px,108px 180px)}
#hexi{background:radial-gradient(ellipse 140px 9px at 300px 171px,rgba(255,45,30,.8),transparent),linear-gradient(180deg,#650100 0,#7a0000 14%,#a00200 44%,#940100 80%,#8c0100 100%);clip-path:polygon(31px 7px,421px 7px,464px 97px,424px 176px,112px 176px)}
#gold{background:linear-gradient(180deg,#fcc132 0,#ffd24a 50%,#f9a510 100%);clip-path:polygon(465px 3px,492px 3px,542px 97px,492px 180px,465px 180px,515px 97px)}

#bn1,#bn2{font-family:Arial,Helvetica,sans-serif;font-weight:900;color:transparent;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 3px 2px rgba(0,0,0,.6))}
#bn1{background-image:linear-gradient(180deg,#fff,#cfcfcf)}
#bn2{background-image:linear-gradient(180deg,#ffe85a,#f4a400)}

/* BOTTOM TICKER & TIME BAR */
#under{left:0;top:948px;width:1920px;height:132px;background:linear-gradient(90deg,#d6d4d4 0,#e9c0cc 16%,#faf1f2 45%,#f2eeee 70%,#dedede 100%);z-index:18}
#time{left:30px;top:970px;width:215px;height:88px;border-radius:12px 0 0 12px;background:linear-gradient(#e11d2a,#9c0914);color:#fff;font-size:42px;line-height:92px;text-align:center;font-weight:800;box-shadow:inset 0 2px 0 rgba(255,255,255,.35);z-index:22}
#date{left:235px;top:970px;width:210px;height:88px;background:#fff;clip-path:polygon(18px 0,100% 0,100% 100%,0 100%);text-align:center;font-size:28px;line-height:34px;padding-top:11px;color:#111;font-weight:700;z-index:22}
#label{left:445px;top:970px;width:260px;height:88px;background:linear-gradient(#e11d2a,#a00a16);clip-path:polygon(0 0,100% 0,100% 100%,0 100%,14px 50%);color:#fff;font-size:50px;line-height:84px;font-weight:900;text-align:center;padding-left:14px;text-shadow:0 3px 3px rgba(0,0,0,.4);z-index:22}
#ticker{left:698px;top:970px;width:1222px;height:88px;background:linear-gradient(#10215f,#081338);overflow:hidden;border-top:2px solid #2a3f8f;z-index:22}
#track{position:absolute;left:0;top:0;white-space:nowrap;display:inline-block;color:#fff;font-size:40px;line-height:84px;font-weight:600;animation:scroll 40s linear infinite;will-change:transform}
#track span{padding-right:140px}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style>
</head>
<body>
<div id="canvas">
 <div class="glow"></div>

 <!-- HEADER -->
 <div id="header" class="abs"></div>

 <!-- BANNER -->
 <div id="banner" class="abs">
  <div class="red"></div>
  <div class="fit bt1" data-w="212" data-cx="136" data-by="81">आज की</div>
  <div class="fit bt2" data-w="265" data-cx="425" data-by="81">बड़ी खबर</div>
 </div>

 <!-- 3 TOP CARDS WITH IMAGES -->
 <!-- Card 1: Palace -->
 <div class="card card-1 abs">
  <div class="thumb-box"><img src="palace.jpg" alt="प्रदेश की हर खबर"></div>
  <div class="a">प्रदेश की हर खबर</div>
  <div class="b">सबसे पहले</div>
 </div>

 <!-- Card 2: Globe -->
 <div class="card card-2 abs">
  <div class="thumb-box globe-box"><img src="globe.jpg" alt="देश-दुनिया की"></div>
  <div class="a">देश-दुनिया की</div>
  <div class="b">ताजा अपडेट</div>
 </div>

 <!-- Card 3: Street / Highway -->
 <div class="card card-3 abs">
  <div class="thumb-box"><img src="highway.jpg" alt="आपके शहर की"></div>
  <div class="a">आपके शहर की</div>
  <div class="b">हर छोटी-बड़ी खबर</div>
 </div>

 <!-- TOP RIGHT LOGO BADGE -->
 <div id="logo" class="abs">
  <img id="logoImg" src="logo.png" alt="Channel Logo">
 </div>

 <!-- LEFT PANEL -->
 <div id="left" class="abs">
  <h2>मुख्य <span>खबरें</span></h2>
  <div id="list"></div>
 </div>

 <!-- FOOTAGE FRAME & LOCATION -->
 <div id="frame" class="abs"></div>
 <div id="loc" class="abs"><div class="pin"></div><div class="nm" id="location"></div></div>

 <!-- BREAKING NEWS BANNER -->
 <div id="brk" class="abs">
  <div id="sub"><div id="subt" class="fit st" data-w="1023" data-max="52" data-cx="686" data-by="54"></div></div>
  <div id="hl" class="fit hs" data-w="1230" data-max="80" data-cx="1210" data-by="83"></div>
  <div id="band"></div><div id="lc"></div>
  <div id="hexo"></div><div id="hexi"></div><div id="gold"></div>
  <div id="bn1" class="fit" data-w="380" data-cx="255" data-by="77">BREAKING</div>
  <div id="bn2" class="fit" data-w="285" data-cx="254" data-by="155">NEWS</div>
 </div>

 <!-- BOTTOM BAR -->
 <div id="under" class="abs"></div>
 <div id="time" class="abs"></div>
 <div id="date" class="abs"></div>
 <div id="label" class="abs">ताजा खबर</div>
 <div id="ticker" class="abs"><div id="track"></div></div>
</div>

<script>
const CONFIG = {
  mainHeadline: "भोपाल में आज तेज बारिश, कई इलाकों में जलभराव",
  subtitle: "मौसम विभाग ने अगले 24 घंटे के लिए जारी किया अलर्ट",
  location: "भोपाल, मध्य प्रदेश",
  sideHeadlines: [
    "भोपाल से<br>इस वक्त की बड़ी खबर",
    "प्रदेश में मौसम<br>को लेकर नया अपडेट",
    "देश-दुनिया की<br>खास खबरें",
    "बाजार में आज<br>का हाल",
    "खेल जगत से<br>बड़ी अपडेट"
  ],
  tickerText: "भोपाल | इंदौर | ग्वालियर | जबलपुर | उज्जैन | सागर | रीवा | और देश-दुनिया की हर खबर",
  useSystemClock: true,          // false = use fixedTime/fixedDate
  fixedTime: "10:25 AM",
  fixedDate: "28 Oct 2026",
  fixedWeekday: "मंगलवार"
};

const $ = id => document.getElementById(id);
$('hl').textContent = CONFIG.mainHeadline;
$('subt').textContent = CONFIG.subtitle;
$('location').textContent = CONFIG.location;
$('list').innerHTML = CONFIG.sideHeadlines.map((h,i)=>
  `<div class="news" style="top:${82+i*98}px"><div class="num">0${i+1}</div><div class="tx">${h}</div></div>`).join('');
$('track').innerHTML = `<span>${CONFIG.tickerText}</span><span>${CONFIG.tickerText}</span>`;

const days = ["रविवार","सोमवार","मंगलवार","बुधवार","गुरुवार","शुक्रवार","शनिवार"];
const mons = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function tick(){
  if(!CONFIG.useSystemClock){
    $('time').textContent = CONFIG.fixedTime;
    $('date').innerHTML = CONFIG.fixedDate + "<br>" + CONFIG.fixedWeekday;
    return;
  }
  const d = new Date();
  let h = d.getHours(), ap = h>=12?"PM":"AM"; h = h%12||12;
  $('time').textContent = `${String(h).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} ${ap}`;
  $('date').innerHTML = `${String(d.getDate()).padStart(2,'0')} ${mons[d.getMonth()]} ${d.getFullYear()}<br>${days[d.getDay()]}`;
}
tick(); setInterval(tick, 1000);

const _cv=document.createElement('canvas').getContext('2d');
function fitAll(){
  document.querySelectorAll('.fit').forEach(el=>{
    if(el.id==='hl'){
      const cs=getComputedStyle(el);
      _cv.font=(cs.fontWeight||'800')+' 100px '+(cs.fontFamily||"'Hind', sans-serif");
      const m=_cv.measureText(el.textContent);
      let fs=Math.min(68, Math.max(38, Math.floor(100*1335/(m.width||1))));
      el.style.fontSize=fs+'px';
      return;
    }
    if(el.id==='subt'){
      const cs=getComputedStyle(el);
      _cv.font=(cs.fontWeight||'800')+' 100px '+(cs.fontFamily||"'Hind', sans-serif");
      const m=_cv.measureText(el.textContent);
      let fs=Math.min(46, Math.max(26, Math.floor(100*1315/(m.width||1))));
      el.style.fontSize=fs+'px';
      return;
    }
    const cs=getComputedStyle(el);
    _cv.font=(cs.fontWeight||'800')+' 100px '+(cs.fontFamily||"'Hind', sans-serif");
    const m=_cv.measureText(el.textContent);
    const L=m.actualBoundingBoxLeft||0, Rr=m.actualBoundingBoxRight||m.width;
    const inkW=(L+Rr)||m.width, inkH=(m.actualBoundingBoxAscent+m.actualBoundingBoxDescent)||0;
    let fs=100*(+el.dataset.w)/(inkW||1);
    if(el.dataset.h&&inkH) fs=Math.min(fs,100*(+el.dataset.h)/inkH);
    if(el.dataset.max) fs=Math.min(fs,+el.dataset.max);
    const k=fs/100;
    const fa=m.fontBoundingBoxAscent, fd=m.fontBoundingBoxDescent;
    const lineCentreAboveBase=(fa!==undefined)?(fa-fd)/2*k:fs*0.3;
    const dx=(Rr-L)/2*k-m.width*k/2;
    el.style.fontSize=fs+'px';
    el.style.left=(+el.dataset.cx-dx)+'px';
    el.style.top=(+el.dataset.by-lineCentreAboveBase)+'px';
  });
}
fitAll(); addEventListener('load',fitAll); setTimeout(fitAll,1200);
if(document.fonts&&document.fonts.load){
  Promise.all([document.fonts.load('800 40px Hind','आज'),document.fonts.load('800 40px "Noto Sans Devanagari"','आज')]).then(fitAll).catch(()=>{});
}

function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  const c = $('canvas');
  c.style.transform = `scale(${s})`;
  c.style.marginLeft = (-960*s)+'px';
  c.style.marginTop = (-540*s)+'px';
}
addEventListener('resize', fit); fit();

window.prepareForOverlayExport = function() {
  document.body.style.background = 'transparent';
  var cv = $('canvas');
  if (cv) cv.style.background = 'transparent';
  var gl = document.querySelector('.glow');
  if (gl) gl.style.display = 'none';
  var fr = $('frame');
  if (fr) fr.style.background = 'transparent';
};

window.restoreAfterOverlayExport = function() {
  document.body.style.background = '#000';
  var cv = $('canvas');
  if (cv) cv.style.background = 'radial-gradient(ellipse at 50% 45%,#1b2a6b 0%,#0c1440 45%,#2a0a14 100%)';
  var gl = document.querySelector('.glow');
  if (gl) gl.style.display = 'block';
};
</script>
</body>
</html>
