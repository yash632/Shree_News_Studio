name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Scaffold Clean Official Flutter Project
        run: |
          # 1. Create pristine official app scaffold with Flutter 3.24.5
          flutter create -t app --org com.shreenews --project-name studio clean_app
          
          # 2. Transfer our code, assets, custom manifest and launcher icons
          rm -rf clean_app/lib/*
          cp -r mobile_app/lib/* clean_app/lib/
          cp -r mobile_app/assets clean_app/
          cp mobile_app/pubspec.yaml clean_app/pubspec.yaml

          # Copy custom AndroidManifest.xml (contains android:label="Shree News")
          cp mobile_app/android/app/src/main/AndroidManifest.xml clean_app/android/app/src/main/AndroidManifest.xml

          # Copy custom MainActivity.kt with native MediaScanner connection
          rm -rf clean_app/android/app/src/main/kotlin/*
          mkdir -p clean_app/android/app/src/main/kotlin
          cp -r mobile_app/android/app/src/main/kotlin/* clean_app/android/app/src/main/kotlin/

          # Remove default flutter adaptive icons so Android strictly uses our custom ic_launcher PNGs
          rm -rf clean_app/android/app/src/main/res/mipmap-anydpi-v26

          # Copy custom launcher icons (golden sword "श्री" icon in all mipmap densities)
          cp -r mobile_app/android/app/src/main/res/* clean_app/android/app/src/main/res/

          # 3. Configure Android SDK 35 & MinSDK 24
          echo "flutter.minSdkVersion=24" >> clean_app/android/local.properties
          echo "flutter.compileSdkVersion=35" >> clean_app/android/local.properties
          echo "flutter.targetSdkVersion=35" >> clean_app/android/local.properties

          if [ -f clean_app/android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' clean_app/android/app/build.gradle || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' clean_app/android/app/build.gradle || true
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' clean_app/android/app/build.gradle || true
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' clean_app/android/app/build.gradle || true
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/g' clean_app/android/app/build.gradle || true
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' clean_app/android/app/build.gradle || true
          fi

          # 4. Add Appodeal & Jitpack Maven mirrors for ffmpeg-kit-full-gpl binary resolution
          cat << 'EOF' >> clean_app/android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://artifactory.appodeal.com/appodeal-public/" }
                  maven { url "https://jitpack.io" }
              }
          }
          EOF

      - name: Build Android Release APK
        run: |
          cd clean_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShreeNewsStudio-Release-APK
          path: clean_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
